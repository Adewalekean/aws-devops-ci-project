version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Installing dependencies..."
      - npm install

  pre_build:
    commands:
      - echo "Running automated tests..."
      - npm test

  build:
    commands:
      - echo "Building the application..."
      - mkdir -p dist
      - cp app.js package.json dist/

  post_build:
    commands:
      - echo "Build and testing completed successfully!"

artifacts:
  files:
    - '**/*'
  base-directory: dist